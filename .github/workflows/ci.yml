name: PragyanAI Platform CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Black Formatter Check
        run: |
          black --check --diff .

      - name: Run Isort Import Sorting Check
        run: |
          isort --check-only --diff .

      - name: Run Flake8 Linter
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length set to 120.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-cov

      - name: Execute Pytest Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'mock_groq_key_for_ci' }}
          DATABASE_PATH: ":memory:"
          FAISS_INDEX_PATH: "storage/vectors/test_index"
        run: |
          pytest --cov=modules --cov-report=term-missing tests/
